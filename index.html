<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Purchase Order → PDF</title>
  <style>
    :root{--pad:12px;--radius:14px;--bg:#f4f4f9;--card:#ffffff;--line:#e5e5e5;--text:#1f2937;--muted:#6b7280}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{font-family:Arial,sans-serif;background:var(--bg);margin:0;padding:12px;line-height:1.45;color:var(--text)}
    .container{max-width:980px;margin:auto;background:var(--card);padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    h1{margin:0 0 10px;font-size:22px;line-height:1.2}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .toolbar label{font-weight:bold}
    .toolbar .spacer{flex:1}
    .filter{flex:1;min-width:220px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
    .muted{color:var(--muted);font-size:13px}
    select,input[type=search],input[type=number]{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
    .qty{display:flex;align-items:center;gap:6px}
    .qty button{width:36px;height:36px;border:none;border-radius:8px;background:#e5e7eb;font-size:18px;font-weight:700;cursor:pointer}
    .qty input{width:56px;text-align:center;padding:8px;border-radius:8px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    table th, table td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
    table th{background:#2f3a4a;color:#fff;position:sticky;top:0;z-index:1}
    .btn{padding:12px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px}
    .btn-primary{background:#28a745;color:#fff}
    .btn-secondary{background:#0069d9;color:#fff}
    .btn-ghost{background:#eef2f7;color:#1f2937}
    .btn.sticky{position:sticky;bottom:0;width:100%;box-shadow:0 -2px 8px rgba(0,0,0,.08);margin-top:10px}
    .status{margin-top:12px;padding:10px;border-radius:10px;font-size:14px}
    .section-row td{font-weight:bold;cursor:pointer}.section-label{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-left{display:flex;align-items:center;gap:8px}.section-caret{font-size:12px;opacity:.8}
    .row-active{background:#effaf2}
    .row-active td{border-color:#cce8d1}

    @media (max-width: 720px){
      body{padding:8px}
      .container{padding:10px;border-radius:0;box-shadow:none;max-width:none;min-height:100vh}
      h1{font-size:20px;margin-bottom:8px}
      .toolbar{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0 10px;border-bottom:1px solid var(--line)}
      .toolbar label{width:100%}
      .toolbar .spacer{display:none}
      .filter{min-width:100%}
      .actions{position:sticky;top:126px;z-index:4;background:#fff;padding:8px 0 10px;border-bottom:1px solid var(--line);margin-top:0}
      .actions .btn{flex:1 1 calc(50% - 4px);padding:11px 12px}
      #orderSummary{width:100%;font-size:12px}
      table thead{display:none}
      table, tbody, tr, td{display:block;width:100%}
      table{margin-top:10px}
      tbody tr{background:#fff;border:1px solid #e8e8e8;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:8px;margin:10px 0}
      tbody td{border:none;border-bottom:1px dashed #eee;padding:8px 6px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
      tbody td:last-child{border-bottom:none}
      tbody td::before{content:attr(data-label);font-weight:700;color:#374151;padding-right:10px;flex:0 0 42%}
      tbody td > *{flex:1}
      .section-row{margin-top:14px;margin-bottom:6px;box-shadow:none;border:none;background:transparent;padding:0}
      .section-row td{border:none!important;border-radius:12px;padding:10px 12px}
      .section-row td::before{content:none}
      input[type=number]{min-height:44px;text-align:center;font-weight:700}
      .btn.sticky{position:static;width:100%}
      #shareBtn,#poForm button[type="submit"]{min-height:48px}
    }

    @media (max-width: 420px){
      .actions .btn{flex:1 1 100%}
      tbody td::before{flex-basis:46%}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Vendor Purchase Order → Auto-PDF</h1>
  <form id="poForm">
    <div class="toolbar">
      <label for="vendor">Vendor:</label>
      <select id="vendor">
        <option value="royal">Royal</option>
        <option value="meats">Meats</option>
        <option value="sysco">Sysco</option>
        <option value="igf">IGF</option>
        <option value="bar">Bar</option>
        <option value="sidney">Sidney Spices</option>
      </select>
      <div class="spacer"></div>
      <input id="filter" class="filter" type="search" placeholder="Filter items… (e.g., onions, salmon)" />
    </div>
    <div class="actions">
      <button type="button" id="clearOrdersBtn" class="btn btn-ghost">Clear Orders</button>
      <button type="button" id="showOrderedBtn" class="btn btn-ghost">Show Ordered Only: Off</button>
      <div id="orderSummary" class="muted">0 items ordered</div>
    </div>
    <table id="itemsTable">
      <thead><tr id="tableHead"></tr></thead>
      <tbody></tbody>
    </table>
    <button type="submit" class="btn btn-primary sticky">Submit & Download PDF</button>
    <button type="button" id="shareBtn" class="btn btn-secondary sticky">Share via Text</button>
    <div id="testStatus" class="status"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script>
(function(){
  function showError(msg){
    const el = document.getElementById('testStatus') || document.body.appendChild(Object.assign(document.createElement('div'), {id:'testStatus', className:'status'}));
    el.textContent = 'Error: ' + msg;
    el.style.color = '#721c24';
    el.style.background = '#f8d7da';
    el.style.border = '1px solid #f5c6cb';
  }
  window.addEventListener('error', e => showError(e.message));
  window.addEventListener('unhandledrejection', e => showError((e.reason && e.reason.message) || String(e.reason)));
})();

function categorize(itemName, vendor){
  const n = (itemName || '').toLowerCase();

  if(vendor === 'royal'){
    const roomTempNames = [
      'onions, jumbo sweet(vidalias)',
      'onions, jumbo yellow',
      'onions, red',
      'potatoes, red a',
      'shallots, large'
    ];
    return roomTempNames.includes(n) ? 'Shelf' : 'Walk-in Cooler';
  }

  if(vendor === 'meats') return 'Cold';

  if(vendor === 'sysco'){
    if(n.includes('biscuits')) return 'Freezer';
    if(n.includes('ciabatta') || n.includes('panini') || n.includes('shaved parm') || n.includes('pecorino') || n.includes('caesar dressing') || n.includes('mayonnaise')) return 'Walk-in';
    if(n.includes('frozen') || n.includes('fries') || n.includes('ice cream') || n.includes('mango')) return 'Freezer';
    if(n.includes('milk')||n.includes('cheese')||n.includes('cream')||n.includes('yogurt')||n.includes('butter')) return 'Walk-in';
    return 'Shelf';
  }

  if(vendor === 'igf'){
    if(
      n.includes('anchovies') || n.includes('caperberries') || n.includes('capers') ||
      n.includes('cherries, maraschino') || n.includes('cornichons') || n.includes('gherkins') || n.includes('demi-glace') ||
      n.includes('dijon') || n.includes('dolmas') || n.includes('dried cherries') ||
      n.includes('gigandes') || n.includes('olives') || n.includes('cocktail onions') || n.includes('taramosalata') || n.includes('hazelnut flour') ||
      n.includes('phyllo') || n.includes('pine nuts') || n.includes('pita bread') ||
      n.includes('plum sauce') || n.includes('roasted red pepper') || n.includes('strawberry preserves') ||
      n.includes('almonds, sliced blanched') || n.includes('walnut halves')
    ) return 'Walk-in';
    if(n.includes('ravioli') || n.includes('sorbet') || n.includes('gelato')) return 'Freezer';
    if(n.includes('cheese') || n.includes('mascarpone') || n.includes('feta') || n.includes('gorgonzola')) return 'Walk-in';
    return 'Shelf';
  }

  if(vendor === 'sidney') return 'Shelf';

  // Bar overrides
  if(vendor === 'bar'){
    if(n.includes('chicken stock')) return 'Shelf';
  }

  if(n.includes('milk')||n.includes('cheese')||n.includes('cream')||n.includes('yogurt')||n.includes('butter')||n.includes('shrimp')||n.includes('salmon')||n.includes('chicken')||n.includes('lamb')||n.includes('mussel')||n.includes('pancetta')||n.includes('peas')) return 'Cold';
  if(n.includes('#10') || n.includes(' jar') || n.includes(', jar') || n.includes(' tin') || n.includes(', tin')) return 'Shelf';
  return 'Shelf';
}

function sectionStyle(type){
  const map = {
    'Shelf': 'background:#fef3c7',
    'Walk-in Cooler': 'background:#dbeafe',
    'Cold': 'background:#fee2e2',
    'Walk-in': 'background:#d1fae5',
    'Freezer': 'background:#e9d5ff',
    
    'Room Temp': 'background:#fef3c7'
  };
  return map[type] || 'background:#e5e7eb';
}

function sectionIcon(type){
  const map = {
    'Shelf': '📦',
    'Walk-in Cooler': '🧊',
    'Cold': '🥩',
    'Walk-in': '🧊',
    'Freezer': '❄️',
    
    'Room Temp': '📦'
  };
  return map[type] || '📁';
}

function getGroupsForVendor(vendor){
  if(vendor === 'royal') return {'Shelf':[], 'Walk-in Cooler':[]};
  if(vendor === 'sysco') return {'Shelf':[], 'Walk-in':[], 'Freezer':[]};
  if(vendor === 'igf') return {'Shelf':[], 'Walk-in':[], 'Freezer':[]};
  if(vendor === 'sidney') return {'Shelf':[]};
  return {Cold:[], Shelf:[]};
}

function loadInventory(vendor){
  tbody.innerHTML = '';
  tableHead.innerHTML = '';
  const data = INVENTORY[vendor] || [];
  const isParType = (vendor === 'royal' || vendor === 'meats');
  tableHead.innerHTML = isParType
    ? '<th>Item</th><th>Pack Size</th><th>Min Par</th><th>Weekend Par</th><th>Order</th>'
    : '<th>Item</th><th>Pack Size</th><th>Par</th><th>Order</th>';

  if(vendor === 'sidney'){
    renderSidney(data);
    restoreVendorOrders(vendor);
    bindOrderInputs();
    applyFilter();
    updateOrderSummary();
    return;
  }

  const groups = getGroupsForVendor(vendor);
  data.forEach(item => {
    const key = categorize(item.name, vendor);
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
  });

  Object.keys(groups).forEach(group => {
    groups[group].sort((a,b) => a.name.localeCompare(b.name));
    if(groups[group].length === 0) return;
    const headerRow = document.createElement('tr');
    headerRow.className = 'section-row';
    headerRow.dataset.section = group;
    headerRow.innerHTML = `<td colspan="${isParType ? 5 : 4}" style="${sectionStyle(group)}"><div class="section-label"><div class="section-left"><span>${sectionIcon(group)}</span><span>${group} (${groups[group].length})</span></div><span class="section-caret">▼</span></div></td>`;
    tbody.appendChild(headerRow);

    groups[group].forEach(item => {
      const tr = document.createElement('tr');
      tr.dataset.itemName = item.name;
      if(isParType){
        tr.innerHTML = `
          <td data-label="Item">${item.name}</td>
          <td data-label="Pack Size">${item.pack ?? ''}</td>
          <td data-label="Min Par">${item.minPar ?? ''}</td>
          <td data-label="Weekend Par">${item.weekendPar ?? ''}</td>
          <td data-label="Order"><div class="qty"><button type="button" class="dec">-</button><input type="number" class="order" value="0" min="0" step="1" readonly><button type="button" class="inc">+</button></div></td>
        `;
      } else {
        tr.innerHTML = `
          <td data-label="Item">${item.name}</td>
          <td data-label="Pack Size">${item.pack ?? ''}</td>
          <td data-label="Par">${item.par ?? ''}</td>
          <td data-label="Order"><div class="qty"><button type="button" class="dec">-</button><input type="number" class="order" value="0" min="0" step="1" readonly><button type="button" class="inc">+</button></div></td>
        `;
      }
      tbody.appendChild(tr);
    });
  });

  restoreVendorOrders(vendor);
  bindOrderInputs();
  bindSectionToggles();
  applyFilter();
  expandSectionsForVisibleRows();
  updateOrderSummary();
}

function renderSidney(data){
  tableHead.innerHTML = '<th>Item</th><th>Pack Size</th><th>Par</th><th>Order</th>';
  data.forEach(item => {
    if(item.isHeader){
      const headerRow = document.createElement('tr');
      headerRow.className = 'section-row';
      headerRow.dataset.section = item.name;
      headerRow.innerHTML = `<td colspan="4" style="background:#111;color:#fff"><div class="section-label"><div class="section-left"><span>🧂</span><span>${item.name}</span></div><span class="section-caret">▼</span></div></td>`;
      tbody.appendChild(headerRow);
      return;
    }
    const tr = document.createElement('tr');
    tr.dataset.itemName = item.name;
    tr.innerHTML = `
      <td data-label="Item">${item.name}</td>
      <td data-label="Pack Size">${item.pack ?? ''}</td>
      <td data-label="Par">${item.par ?? ''}</td>
      <td data-label="Order"><div class="qty"><button type="button" class="dec">-</button><input type="number" class="order" value="0" min="0" step="1" readonly><button type="button" class="inc">+</button></div></td>
    `;
    tbody.appendChild(tr);
  });
}

function applyFilter(){
  const q = (filterInput.value || '').trim().toLowerCase();
  let currentSectionHasVisibleRows = false;
  let lastSectionRow = null;

  document.querySelectorAll('#itemsTable tbody tr').forEach(tr => {
    if(tr.classList.contains('section-row')){
      if(lastSectionRow) lastSectionRow.style.display = currentSectionHasVisibleRows ? '' : 'none';
      lastSectionRow = tr;
      currentSectionHasVisibleRows = false;
      tr.style.display = '';
      return;
    }
    const txt = tr.textContent.toLowerCase();
    const orderInput = tr.querySelector('.order');
    const hasOrder = orderInput && Number(orderInput.value) > 0;
    const matchesText = !q || txt.includes(q);
    const visible = matchesText && (!showOrderedOnly || hasOrder);
    const parentSection = tr.previousElementSibling && tr.previousElementSibling.classList.contains('section-row') ? tr.previousElementSibling : null;
    const parentCollapsed = parentSection && parentSection.dataset.collapsed === 'true';
    tr.style.display = visible && !parentCollapsed ? '' : 'none';
    if(visible) currentSectionHasVisibleRows = true;
  });
  if(lastSectionRow) lastSectionRow.style.display = currentSectionHasVisibleRows ? '' : 'none';
}

function getOrderRows(vendor){
  const rows = [];
  tbody.querySelectorAll('tr').forEach(tr => {
    if(tr.classList.contains('section-row')) return;
    const cols = tr.querySelectorAll('td');
    if(!cols.length) return;
    if(vendor === 'royal' || vendor === 'meats'){
      const orderInput = cols[4]?.querySelector('input');
      const order = orderInput ? orderInput.value : 0;
      if(Number(order) > 0) rows.push([cols[0].innerText, cols[1].innerText, cols[2].innerText, cols[3].innerText, order]);
    } else {
      const orderInput = cols[3]?.querySelector('input');
      const order = orderInput ? orderInput.value : 0;
      if(Number(order) > 0) rows.push([cols[0].innerText, cols[1].innerText, cols[2].innerText, order]);
    }
  });
  return rows;
}

function buildOrderSummary(vendor){
  const lines = [`Vendor: ${vendor.toUpperCase()}`];
  lines.push('Item | Pack | Order');
  for(const row of getOrderRows(vendor)){
    const item = row[0];
    const pack = row[1];
    const order = row[row.length - 1];
    lines.push(`${item} | ${pack} | ${order}`);
  }
  if(lines.length <= 2) lines.push('(No items ordered)');
  return lines.join('\n');
}

function generatePdfForVendor(vendor){
  const doc = new jsPDF({unit:'pt', format:'a4'});
  doc.setFontSize(14);
  doc.text('Vendor Purchase Order', 40, 40);
  const rows = getOrderRows(vendor);
  if(vendor === 'royal' || vendor === 'meats'){
    doc.autoTable({head:[["Item","Pack Size","Min Par","Weekend Par","Order"]], body:rows, startY:60});
  } else {
    doc.autoTable({head:[["Item","Pack Size","Par","Order"]], body:rows, startY:60});
  }
  const blob = doc.output('blob');
  const fileName = `PO-${vendor}-${new Date().toISOString().slice(0,10)}.pdf`;
  return { doc, blob, fileName, rowsCount: rows.length };
}

function loadState(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function saveState(){
  const state = loadState();
  state.vendor = vendorSel.value;
  state.orders = state.orders || {};
  state.orders[vendorSel.value] = {};
  tbody.querySelectorAll('tr').forEach(tr => {
    if(tr.classList.contains('section-row')) return;
    const item = tr.dataset.itemName || tr.querySelector('td')?.innerText;
    const input = tr.querySelector('.order');
    if(item && input) state.orders[vendorSel.value][item] = input.value || '0';
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function restoreVendorOrders(vendor){
  const vendorOrders = loadState().orders?.[vendor] || {};
  tbody.querySelectorAll('tr').forEach(tr => {
    if(tr.classList.contains('section-row')) return;
    const item = tr.dataset.itemName || tr.querySelector('td')?.innerText;
    const input = tr.querySelector('.order');
    if(item && input && vendorOrders[item] != null){
      input.value = vendorOrders[item];
      tr.classList.toggle('row-active', Number(input.value) > 0);
    }
  });
}

function bindOrderInputs(){
  tbody.querySelectorAll('.inc').forEach(btn => {
    btn.onclick = () => {
      const input = btn.parentElement.querySelector('.order');
      input.value = String(Number(input.value || 0) + 1);
      triggerUpdate(input);
    };
  });
  tbody.querySelectorAll('.dec').forEach(btn => {
    btn.onclick = () => {
      const input = btn.parentElement.querySelector('.order');
      input.value = String(Math.max(0, Number(input.value || 0) - 1));
      triggerUpdate(input);
    };
  });
}

function bindSectionToggles(){
  tbody.querySelectorAll('.section-row').forEach(row => {
    row.onclick = () => toggleSection(row);
  });
}

function toggleSection(sectionRow){
  const collapsed = sectionRow.dataset.collapsed === 'true';
  sectionRow.dataset.collapsed = collapsed ? 'false' : 'true';
  const caret = sectionRow.querySelector('.section-caret');
  if(caret) caret.textContent = collapsed ? '▼' : '▶';

  let next = sectionRow.nextElementSibling;
  while(next && !next.classList.contains('section-row')){
    next.style.display = collapsed ? '' : 'none';
    next = next.nextElementSibling;
  }
}

function expandSectionsForVisibleRows(){
  const rows = [...tbody.querySelectorAll('.section-row')];
  rows.forEach(sectionRow => {
    let next = sectionRow.nextElementSibling;
    let hasVisible = false;
    while(next && !next.classList.contains('section-row')){
      if(next.style.display !== 'none') hasVisible = true;
      next = next.nextElementSibling;
    }
    if(hasVisible && sectionRow.dataset.collapsed === 'true') toggleSection(sectionRow);
  });
}

function triggerUpdate(input){
  const row = input.closest('tr');
  const val = Math.max(0, Number(input.value || 0));
  input.value = String(val);
  row.classList.toggle('row-active', val > 0);
  saveState();
  updateOrderSummary();
  applyFilter();
}

function updateOrderSummary(){
  const count = getOrderRows(vendorSel.value).length;
  orderSummary.textContent = count === 0 ? '0 items ordered' : `${count} items ordered`;
  const submitBtn = document.querySelector('#poForm button[type="submit"]');
  const shareBtn = document.getElementById('shareBtn');
  submitBtn.disabled = count === 0;
  shareBtn.disabled = count === 0;
  submitBtn.style.opacity = count === 0 ? '0.6' : '1';
  shareBtn.style.opacity = count === 0 ? '0.6' : '1';
}

function init(){
  const state = loadState();
  if(state.vendor && INVENTORY[state.vendor]) vendorSel.value = state.vendor;
  loadInventory(vendorSel.value || 'royal');

  vendorSel.addEventListener('change', e => {
    const nextState = loadState();
    nextState.vendor = e.target.value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
    loadInventory(e.target.value);
  });

  filterInput.addEventListener('input', () => {
    applyFilter();
    expandSectionsForVisibleRows();
  });

  clearOrdersBtn.addEventListener('click', () => {
    tbody.querySelectorAll('.order').forEach(input => {
      input.value = '0';
      input.closest('tr')?.classList.remove('row-active');
    });
    saveState();
    updateOrderSummary();
    applyFilter();
    expandSectionsForVisibleRows();
  });

  showOrderedBtn.addEventListener('click', () => {
    showOrderedOnly = !showOrderedOnly;
    showOrderedBtn.textContent = `Show Ordered Only: ${showOrderedOnly ? 'On' : 'Off'}`;
    applyFilter();
    expandSectionsForVisibleRows();
  });

  document.querySelector('#poForm').addEventListener('submit', e => {
    e.preventDefault();
    const vendor = vendorSel.value;
    const { doc, fileName, rowsCount } = generatePdfForVendor(vendor);
    if(rowsCount === 0) return;
    doc.save(fileName);
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const vendor = vendorSel.value;
    const { blob, fileName, rowsCount } = generatePdfForVendor(vendor);
    if(rowsCount === 0) return;
    const summaryText = buildOrderSummary(vendor);
    try {
      const pdfFile = new File([blob], fileName, {type:'application/pdf'});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[pdfFile]})){
        await navigator.share({files:[pdfFile], title:'Purchase Order', text: summaryText});
        return;
      }
    } catch(err) {
      console.warn('Share failed or unsupported', err);
    }
    const smsBody = encodeURIComponent(summaryText);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const smsURL = isIOS ? `sms:&body=${smsBody}` : `sms:${PHONE_NUMBER}?body=${smsBody}`;
    try { window.location.href = smsURL; } catch(_) {}
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });

  runSelfTests();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

function runSelfTests(){
  const results = [];
  const test = (name, fn) => {
    try { fn(); results.push({name, ok:true}); }
    catch(e){ results.push({name, ok:false, msg:e.message}); }
  };

  test('Inventory present', () => { if(!INVENTORY.royal?.length) throw new Error('Royal inventory missing'); });
  test('Render Royal columns', () => {
    loadInventory('royal');
    const heads = [...document.querySelectorAll('#tableHead th')].map(h => h.textContent.trim());
    if(heads.join('|') !== 'Item|Pack Size|Min Par|Weekend Par|Order') throw new Error('Royal header mismatch');
  });
  test('Render Sysco columns', () => {
    loadInventory('sysco');
    const heads = [...document.querySelectorAll('#tableHead th')].map(h => h.textContent.trim());
    if(heads.join('|') !== 'Item|Pack Size|Par|Order') throw new Error('Sysco header mismatch');
  });
  test('Render Sidney columns', () => {
    loadInventory('sidney');
    const heads = [...document.querySelectorAll('#tableHead th')].map(h => h.textContent.trim());
    if(heads.join('|') !== 'Item|Pack Size|Par|Order') throw new Error('Sidney header mismatch');
  });
  test('Share button exists', () => { if(!document.getElementById('shareBtn')) throw new Error('Share button missing'); });
  test('Clear button exists', () => { if(!document.getElementById('clearOrdersBtn')) throw new Error('Clear button missing'); });
  test('Show ordered toggle exists', () => { if(!document.getElementById('showOrderedBtn')) throw new Error('Show ordered toggle missing'); });

  loadInventory(vendorSel.value || 'royal');
  const el = document.getElementById('testStatus');
  const ok = results.every(r => r.ok);
  el.textContent = ok ? 'Self-tests passed' : 'Self-tests: ' + results.map(r => `${r.ok ? '✅' : '❌'} ${r.name}${r.msg ? (' - ' + r.msg) : ''}`).join(' | ');
  el.style.color = ok ? '#155724' : '#721c24';
  el.style.background = ok ? '#d4edda' : '#f8d7da';
  el.style.border = ok ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
}
</script>
